<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized JobHunter application tracker example</title>
  <desc id="desc">A spreadsheet-style tracker showing application dates, statuses, job titles, companies, platforms, and URLs with status-based row colors.</desc>
  <rect width="1280" height="360" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111827">
    <rect x="0" y="0" width="1280" height="28" fill="#f3f4f6"/>
    <g fill="#374151" font-size="12">
      <text x="14" y="19">1</text>
      <text x="14" y="78">2</text>
      <text x="14" y="148">3</text>
      <text x="14" y="228">4</text>
      <text x="14" y="308">5</text>
    </g>
    <g fill="#374151" font-size="13" font-weight="700" text-anchor="middle">
      <text x="90" y="19">A</text>
      <text x="215" y="19">B</text>
      <text x="350" y="19">C</text>
      <text x="560" y="19">D</text>
      <text x="720" y="19">E</text>
      <text x="825" y="19">F</text>
      <text x="1015" y="19">G</text>
      <text x="1205" y="19">H</text>
    </g>

    <rect x="28" y="28" width="1252" height="44" fill="#dbe7fb"/>
    <rect x="28" y="72" width="1252" height="70" fill="#dff1d8"/>
    <rect x="28" y="142" width="1252" height="78" fill="#dce9ff"/>
    <rect x="28" y="220" width="1252" height="78" fill="#f7d6cc"/>
    <rect x="28" y="298" width="1252" height="54" fill="#dce9ff"/>

    <g stroke="#c7cdd8" stroke-width="1">
      <line x1="28" y1="0" x2="28" y2="360"/>
      <line x1="130" y1="0" x2="130" y2="360"/>
      <line x1="250" y1="0" x2="250" y2="360"/>
      <line x1="390" y1="0" x2="390" y2="360"/>
      <line x1="690" y1="0" x2="690" y2="360"/>
      <line x1="760" y1="0" x2="760" y2="360"/>
      <line x1="890" y1="0" x2="890" y2="360"/>
      <line x1="1140" y1="0" x2="1140" y2="360"/>
      <line x1="1280" y1="0" x2="1280" y2="360"/>
      <line x1="0" y1="28" x2="1280" y2="28"/>
      <line x1="0" y1="72" x2="1280" y2="72"/>
      <line x1="0" y1="142" x2="1280" y2="142"/>
      <line x1="0" y1="220" x2="1280" y2="220"/>
      <line x1="0" y1="298" x2="1280" y2="298"/>
      <line x1="0" y1="352" x2="1280" y2="352"/>
    </g>

    <g font-size="18" font-weight="700">
      <text x="34" y="56">Applied At</text>
      <text x="136" y="56">Last Updated</text>
      <text x="256" y="56">Status</text>
      <text x="396" y="56">Job Title</text>
      <text x="696" y="56">Company</text>
      <text x="766" y="56">Platform</text>
      <text x="896" y="56">Job URL</text>
      <text x="1146" y="56">Application URL</text>
    </g>

    <g font-size="16">
      <text x="34" y="100">10/07/2026 16:21</text>
      <text x="136" y="100">11/07/2026 18:00</text>
      <text x="256" y="100">submitted</text>
      <text x="396" y="100">Solutions Architect</text>
      <text x="696" y="100">ExampleCo</text>
      <text x="766" y="100">Company Careers</text>
      <text x="896" y="100" fill="#1d4ed8">https://example.com/jobs/123</text>
      <text x="1146" y="100" fill="#1d4ed8">https://ats.example.com/apply/123</text>

      <text x="34" y="170">02/07/2026 14:23</text>
      <text x="136" y="170">11/07/2026 18:00</text>
      <text x="256" y="170">package_generated</text>
      <text x="396" y="170">Senior Backend Engineer</text>
      <text x="696" y="170">Sample Labs</text>
      <text x="766" y="170">LinkedIn</text>
      <text x="896" y="170" fill="#1d4ed8">https://linkedin.example/jobs/456</text>
      <text x="1146" y="170" fill="#1d4ed8">https://linkedin.example/jobs/456</text>

      <text x="34" y="248">02/07/2026 02:43</text>
      <text x="136" y="248">11/07/2026 18:00</text>
      <text x="256" y="248">blocked_login_required</text>
      <text x="396" y="248">Platform Engineer</text>
      <text x="696" y="248">DemoCloud</text>
      <text x="766" y="248">LinkedIn</text>
      <text x="896" y="248" fill="#1d4ed8">https://linkedin.example/jobs/789</text>
      <text x="1146" y="248" fill="#1d4ed8">https://linkedin.example/jobs/789</text>

      <text x="34" y="326">01/07/2026 21:05</text>
      <text x="136" y="326">11/07/2026 18:00</text>
      <text x="256" y="326">draft_ready</text>
      <text x="396" y="326">Technical Lead</text>
      <text x="696" y="326">ExampleAI</text>
      <text x="766" y="326">ATS</text>
      <text x="896" y="326" fill="#1d4ed8">https://example.com/jobs/321</text>
      <text x="1146" y="326" fill="#1d4ed8">https://ats.example.com/apply/321</text>
    </g>
  </g>
</svg>
